<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Pi Monitor background workflow</title>
  <desc id="desc">The agent starts a bounded monitor and receives an ID immediately. A background scheduler queries a trusted tool or executes a shell command. Shell query-only behavior is a prompt constraint, not command filtering. A matching condition, query failure or timeout sends a concise status notification to resume the session. Cancellation stops queries without a notification.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667085"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .h{font-size:20px;font-weight:700} .b{font-size:15px} .s{font-size:13px;fill:#475467} .line{fill:none;stroke:#667085;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="390" fill="#ffffff"/>
  <text x="32" y="40" class="h">Pi Monitor</text>
  <text x="32" y="64" class="b">Bounded waiting, without a model polling loop</text>
  <rect x="32" y="100" width="220" height="104" rx="6" fill="#eef2ff" stroke="#8c9de3"/>
  <text x="50" y="132" class="h">Agent</text>
  <text x="50" y="158" class="b">monitor_start</text>
  <text x="50" y="184" class="s">Returns monitorId immediately</text>
  <path d="M252 150H310" class="line"/>
  <rect x="314" y="100" width="300" height="104" rx="6" fill="#eaf7f0" stroke="#77b795"/>
  <text x="332" y="132" class="h">Background scheduler</text>
  <text x="332" y="158" class="b">Trusted query or shell command</text>
  <text x="332" y="184" class="s">Bounded interval, retries and deadline</text>
  <path d="M464 204V240H590" class="line"/>
  <text x="325" y="267" class="s">Match / query failure / timeout</text>
  <rect x="594" y="214" width="334" height="100" rx="6" fill="#f3f5f7" stroke="#a0a8b3"/>
  <text x="612" y="246" class="h">Session resumes</text>
  <text x="612" y="272" class="b">Concise status notification</text>
  <text x="612" y="298" class="s">Observation, not permission to act</text>
  <path d="M614 150H668" class="line"/>
  <text x="686" y="144" class="b">Pi terminal or Pi-Web</text>
  <text x="686" y="168" class="s">Optional live status widget</text>
  <text x="32" y="350" class="b">monitor_cancel stops polling and suppresses completion notifications.</text>
  <text x="32" y="374" class="s">Compatible Pi host required. Pi-Web is supported, not required.</text>
</svg>
