name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - name: Install pinned cross-plugin fixtures (no lifecycle scripts)
        run: >-
          npm install --prefix "$RUNNER_TEMP/monitor-fixtures"
          --ignore-scripts --no-audit --no-fund
          billion-context@0.1.215 pi-mcp-adapter@7.0.1
      - run: npm test
        env:
          PI_MONITOR_ACP_ROOT: >-
            ${{ runner.temp }}/monitor-fixtures/node_modules/billion-context
          PI_MONITOR_MCP_ROOT: >-
            ${{ runner.temp }}/monitor-fixtures/node_modules/pi-mcp-adapter
      - run: npm pack --dry-run
